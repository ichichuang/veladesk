name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Release tags (created by release.yml AFTER quality + all platform
    # packages pass, or by a deliberate manual tag) are the DEPLOYMENT
    # channel: a v* tag push automatically deploys that exact tag's SHA to
    # RackNerd. No manual dispatch involved.
    tags: ["v*"]
  # Manual entry for the production deploy path (deploy task): dispatching on
  # main re-runs the full quality job and then deploys exactly this run's
  # SHA. The dispatch itself carries no inputs of any kind.
  workflow_dispatch:

permissions:
  contents: read

# NOTE (deploy task): no workflow-level concurrency any more. Validation
# (quality) keeps the old cancel-on-new-push semantics at job level; the
# production deploy job has its own serialized group so a new push can never
# cancel an in-flight deploy — only validation may be cancelled.
jobs:
  quality:
    concurrency:
      group: ci-quality-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Version gate (task 025): the root package.json is the single
      # version source; any drifted workspace manifest fails the PR.
      - name: Version check
        run: pnpm version:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

      - name: Standalone API smoke
        run: pnpm --filter @veladesk/web smoke:standalone

  # ─────────────────────────────────────────────────────────────────────────
  # Production deploy — RackNerd (docs/DEPLOYMENT.md 「RackNerd 自动部署」).
  #
  # Invariants:
  #   - Deployment channel: RELEASE TAGS. A `v*` tag push deploys that tag's
  #     exact SHA automatically (release.yml creates the tag only after the
  #     full quality + 3-platform packaging pipeline passed — the tag IS the
  #     validated release act). Plain main pushes deploy ONLY when the
  #     environment variable VELADESK_AUTO_DEPLOY is 'true' (gate step —
  #     environment-scoped vars are reliable at step level, not at job-if
  #     level); a manual workflow_dispatch deploys regardless.
  #   - Only this run's exact validated SHA is ever deployed: quality ran on
  #     github.sha (version check / typecheck / lint / tests / build / smoke)
  #     and every step below checks out that same immutable ref — never
  #     whatever main or latest resolves to later.
  #   - Pull requests are structurally outside this job (job-if; the
  #     environment carries no branch policy so tag refs can deploy too).
  #   - Deploys serialize via the veladesk-deploy-production concurrency
  #     group plus a host-side flock; the host rejects stale runs and treats
  #     the already-deployed SHA as a no-op (a main push deployed first
  #     simply turns the later tag deploy into a verified no-op).
  #   - The runner never sends paths or shell commands to production: it
  #     uploads one checksummed tarball and calls the single sudo entry
  #     /usr/local/sbin/veladesk-deploy.sh with validated identifiers only.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: deploy (racknerd)
    needs: quality
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-racknerd
    concurrency:
      group: veladesk-deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ vars.VELADESK_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.VELADESK_DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.VELADESK_DEPLOY_USER }}
      PUBLIC_URL: ${{ vars.VELADESK_PUBLIC_URL }}
      VELADESK_AUTO_DEPLOY: ${{ vars.VELADESK_AUTO_DEPLOY }}
    steps:
      - name: Auto-deploy gate
        id: gate
        run: |
          # Release tags deploy unconditionally (the tag itself is the
          # validated release act); dispatch always deploys; plain main
          # pushes need VELADESK_AUTO_DEPLOY == 'true'.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] \
             || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] \
             || { [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$VELADESK_AUTO_DEPLOY" = "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "deploy: proceeding (event=${GITHUB_EVENT_NAME}, ref=${GITHUB_REF}, VELADESK_AUTO_DEPLOY=${VELADESK_AUTO_DEPLOY:-<unset>})"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "deploy: SKIPPED (not a release tag; VELADESK_AUTO_DEPLOY is not 'true'; a v* tag or manual workflow_dispatch deploys)"
          fi

      - name: Set up SSH (dedicated deploy key, pinned host key)
        if: steps.gate.outputs.run == 'true'
        env:
          SSH_KEY: ${{ secrets.VELADESK_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VELADESK_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Strict host checking against the pinned key only — never accept-new.
          printf '%s\n' "Host veladesk-production" "  HostName ${DEPLOY_HOST}" \
            "  Port ${DEPLOY_PORT}" "  User ${DEPLOY_USER}" \
            "  IdentityFile ~/.ssh/id_ed25519" \
            "  UserKnownHostsFile ~/.ssh/known_hosts" \
            "  StrictHostKeyChecking yes" "  BatchMode yes" > ~/.ssh/config

      - name: Checkout (the exact validated SHA)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Refuse to deploy when the host deploy script drifted
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          expected="$(sha256sum scripts/deploy-racknerd.sh | cut -d' ' -f1)"
          installed="$(ssh veladesk-production 'sha256sum /usr/local/sbin/veladesk-deploy.sh' | cut -d' ' -f1)"
          echo "repo script:    $expected"
          echo "host script:    $installed"
          if [ "$installed" != "$expected" ]; then
            echo "::error::/usr/local/sbin/veladesk-deploy.sh on the host is not the version from this commit. Copy scripts/deploy-racknerd.sh to the host first (docs/DEPLOYMENT.md, one-time setup step 4)."
            exit 1
          fi

      # better-sqlite3 v13 ships NO prebuilds — it compiles from source at
      # install time against the BUILD machine's glibc. A binary compiled on
      # ubuntu-latest (glibc 2.39) fails to load on the Debian 12 production
      # host (glibc 2.36) and every API route answers 500. So the production
      # bundle MUST be built inside the production distro: the exact image and
      # toolchain the Dockerfile build stage uses (node:24-bookworm-slim +
      # python3/make/g++ + pnpm 11.17.0).
      - name: Build and package inside the production image (Debian 12)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          docker run --rm -e SHA -v "$PWD:/src" -w /src node:24-bookworm-slim bash -euc '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 make g++ >/dev/null &&
            npm install --global pnpm@11.17.0 >/dev/null &&
            pnpm install --frozen-lockfile &&
            pnpm build &&
            node apps/web/scripts/package-release.mjs --out dist &&
            PKG_DIR="$(node -e "const m=JSON.parse(require(\"node:fs\").readFileSync(\"dist/release-manifest.json\",\"utf8\"));console.log(m.directory)")" &&
            tar -czf "dist/veladesk-${SHA}.tar.gz" -C "$(dirname "$PKG_DIR")" "$(basename "$PKG_DIR")" &&
            sha256sum "dist/veladesk-${SHA}.tar.gz" | cut -d" " -f1 > "dist/veladesk-${SHA}.sha256"
          '
          echo "bundle:"; ls -la dist/veladesk-*

      - name: Stage the bundle on the VPS
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          scp "dist/veladesk-${SHA}.tar.gz" "veladesk-production:/var/tmp/veladesk-deploy/"

      - name: Deploy (single validated server-side entry point)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          sha256="$(cat "dist/veladesk-${SHA}.sha256")"
          ssh veladesk-production \
            "sudo -n /usr/local/sbin/veladesk-deploy.sh --commit '${SHA}' --sha256 '${sha256}' --run-id '${GITHUB_RUN_ID}'" \
            | tee deploy-output.txt

      - name: Verify the running release identity (server-side, read-only)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          deployed="$(ssh veladesk-production 'cat /opt/veladesk/current/COMMIT')"
          echo "server /opt/veladesk/current/COMMIT: $deployed"
          if [ "$deployed" != "$SHA" ]; then
            echo "::error::the server is not running ${SHA} — a cached HTTP 200 would prove nothing"
            exit 1
          fi

      - name: Verify the public HTTPS site (through Cloudflare, status only)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          code=000; api=000
          for i in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${PUBLIC_URL}/" || true)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          api="$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "${PUBLIC_URL}/api/v1/workspaces" || true)"
          echo "public ${PUBLIC_URL}/ -> ${code}; /api/v1/workspaces -> ${api}"
          if [ "$code" != "200" ] || [ "$api" != "200" ]; then
            echo "::error::public site check failed (${code}/${api}). The local service is healthy and migrations HAVE run — automatic rollback is disabled by design here; see docs/DEPLOYMENT.md 「回滚边界」."
            exit 1
          fi

      - name: Job summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          {
            echo "## VelaDesk deploy — ${SHA}"
            echo '```'
            cat deploy-output.txt 2>/dev/null || echo "(no deploy output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
